# Downloads FinMind data on GitHub's machines, so no local computer is needed.
#
# Monthly calendar (Taipei time). The free tier allows ~550 calls an hour and
# needs one call per stock and dataset, so a full refresh takes about a day.
#
# * Days 7–10, four times a day: refresh prices, valuation, institutional
#   flows and corporate actions (each run downloads ≤5.3 h, then resumes in
#   the next run; once everything is fresh the runs do nothing).
# * Days 11–13: refresh monthly revenue (published by the 10th), then write
#   this month's orders for the strategy chosen by `twbt search` to
#   `live/latest.md` on the `reports` branch.
# * Day 25: refresh prices of the current holdings and write
#   `live/status.md` (how the holdings have done since the orders).
# * Manual runs: download everything older than ~25 days, optionally run the
#   research study / strategy search, and write a full diagnostic report.
#
# Results go to the run's summary page and to the `reports` branch.
#
# Setup: Settings → Secrets and variables → Actions → New secret FINMIND_TOKEN.
# Keep this repo private: FinMind's licence does not allow redistributing data.

name: data

on:
  schedule:
    - cron: "17 1,7,13,19 7-10 * *"  # bulk refresh
    - cron: "47 2 11-13 * *"         # revenue + monthly orders
    - cron: "47 2 25 * *"            # holdings status
  workflow_dispatch:
    inputs:
      download:
        description: "Download from FinMind (false = only rebuild and report)"
        type: boolean
        default: true
      research:
        description: "Run the full research study (≈15 min) and publish it on `reports`"
        type: boolean
        default: false
      search:
        description: "Run the strategy search (ten candidate signals) and publish it on `reports`"
        type: boolean
        default: false
      plan:
        description: "Check the live-trading design (docs/plan) against history"
        type: boolean
        default: false
      live:
        description: "Also write this month's orders and the holdings status"
        type: boolean
        default: false
      experiments:
        description: "Extra twbt runs for the report, separated by ';' (e.g. backtest --top-n 30)"
        type: string
        default: ""

permissions:
  contents: write  # push the text report to the `reports` branch

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[research]"

      - name: Decide what this run does
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "17 1,7,13,19 7-10 * *") echo "mode=bulk" >> "$GITHUB_OUTPUT" ;;
            "47 2 11-13 * *")        echo "mode=orders" >> "$GITHUB_OUTPUT" ;;
            "47 2 25 * *")           echo "mode=status" >> "$GITHUB_OUTPUT" ;;
            *)                       echo "mode=manual" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore raw data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Last published results (strategy, orders)
        run: |
          mkdir -p prev
          if git fetch -q --depth 1 origin reports 2>/dev/null; then
            git show FETCH_HEAD:strategy/results.json > prev/results.json 2>/dev/null || rm -f prev/results.json
            git show FETCH_HEAD:live/latest.json > prev/latest.json 2>/dev/null || rm -f prev/latest.json
          fi
          ls -la prev

      - name: Download (stops itself before the job time limit)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          case "$MODE" in
            bulk)
              args="--min-age-hours 480 --datasets TaiwanStockPrice TaiwanStockPER
                    TaiwanStockInstitutionalInvestorsBuySell TaiwanStockDividendResult
                    TaiwanStockCapitalReductionReferencePrice" ;;
            orders)
              args="--min-age-hours 20 --datasets TaiwanStockMonthRevenue" ;;
            status)
              ids=$(python -c "import json;print(','.join(h['stock_id'] for h in json.load(open('prev/latest.json'))['holdings']))" 2>/dev/null || true)
              if [ -z "$ids" ]; then echo "no holdings yet"; exit 0; fi
              args="--min-age-hours 12 --datasets TaiwanStockPrice TaiwanStockPER --stocks $ids" ;;
            manual)
              if [ "${{ inputs.download }}" != "true" ]; then exit 0; fi
              args="--min-age-hours 600" ;;
          esac
          timeout --signal=INT 320m twbt update $args 2>&1 | tee update.log \
            || echo "stopped, will resume"

      - name: Save raw data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - run: twbt build

      - name: Research study
        if: inputs.research
        run: twbt research --out data/research

      - name: Strategy search
        if: inputs.search
        run: twbt search --out data/strategy

      - name: Plan check
        if: inputs.plan
        run: twbt plan --out data/plan

      - name: Monthly orders
        if: steps.mode.outputs.mode == 'orders' || inputs.live
        run: |
          # The owner-approved design in docs/plan decides the orders. Without it
          # nothing is ordered: a search result alone is never traded.
          results=docs/plan/config.json
          if [ ! -f "$results" ]; then echo "no strategy chosen yet (run the search)"; exit 0; fi
          prevarg=""; [ -f prev/latest.json ] && prevarg="--previous prev/latest.json"
          twbt live --results "$results" $prevarg --out data/live

      - name: Holdings status
        if: steps.mode.outputs.mode == 'status' || inputs.live
        run: |
          latest=prev/latest.json
          [ -f data/live/latest.json ] && latest=data/live/latest.json
          if [ ! -f "$latest" ]; then echo "no holdings yet"; exit 0; fi
          twbt track --latest "$latest" --out data/live

      - name: Report (run summary page + `reports` branch)
        if: always()
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          {
            echo "# twbt report — run ${{ github.run_id }} ($MODE), $(date -u +%Y-%m-%dT%H:%MZ)"
            echo; echo '## status'; echo '```'; twbt status 2>&1 || echo "(exit $?)"; echo '```'
            echo; echo '## download log (last 40 lines)'; echo '```'
            tail -n 40 update.log 2>/dev/null || echo "(no download this run)"; echo '```'
            for f in data/live/latest.md data/live/status.md; do
              [ -f "$f" ] && { echo; cat "$f"; }
            done
            if [ "$MODE" = manual ]; then
              echo; echo '## backtest: revenue strategy vs 0050'; echo '```'
              twbt backtest --no-save 2>&1 || echo "(exit $?)"; echo '```'
              IFS=';' read -ra runs <<< "$EXPERIMENTS"
              for cmd in "${runs[@]}"; do
                read -ra argv <<< "$cmd"
                [ ${#argv[@]} -eq 0 ] && continue
                echo; echo "## experiment: twbt ${argv[*]}"; echo '```'
                twbt "${argv[@]}" 2>&1 || echo "(exit $?)"; echo '```'
              done
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          dir=$(mktemp -d); cp report.md "$dir/"
          # Keep what earlier runs published; replace a directory only when this
          # run produced it. live/ is merged so the monthly history accumulates.
          git fetch -q --depth 1 origin reports 2>/dev/null || true
          for d in research strategy plan live; do
            git archive FETCH_HEAD "$d" 2>/dev/null | tar -x -C "$dir" || true
            if [ -d "data/$d" ]; then
              [ "$d" != live ] && rm -rf "$dir/$d"
              mkdir -p "$dir/$d" && cp -r "data/$d/." "$dir/$d/"
            fi
          done
          cd "$dir"
          git init -q -b reports && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com \
            commit -q -m "report ${{ github.run_id }} ($MODE)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" reports

      - uses: actions/upload-artifact@v4
        with:
          name: clean-data
          path: data/clean
          retention-days: 30
