# Downloads FinMind data on GitHub's machines, so no local computer is needed.
#
# * Runs daily. Each run downloads for up to ~5.3 hours, then stops cleanly;
#   progress is kept in the Actions cache and the next run resumes.
# * After that, --min-age-hours 600 makes runs no-ops until data is ~25 days
#   old, i.e. one refresh a month (enough for monthly rebalancing).
# * The clean layer is uploaded as the `clean-data` artifact after every run.
# * Status, the tail of the download log, the backtest summary and this month's
#   target portfolio go to the run's summary page and to report.md on the
#   `reports` branch (overwritten each run).
#
# Setup: Settings → Secrets and variables → Actions → New secret FINMIND_TOKEN.
# Keep this repo private: FinMind's licence does not allow redistributing data.

name: data

on:
  schedule:
    - cron: "17 1 * * *"  # daily 09:17 Taipei; data refreshes ~monthly
  workflow_dispatch:
    inputs:
      download:
        description: "Download from FinMind (false = only rebuild and report)"
        type: boolean
        default: true
      research:
        description: "Run the full research study (≈15 min) and publish it on `reports`"
        type: boolean
        default: false
      experiments:
        description: "Extra twbt runs for the report, separated by ';' (e.g. backtest --top-n 30)"
        type: string
        default: ""

permissions:
  contents: write  # push the text report to the `reports` branch

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[research]"

      - name: Restore raw data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Download (stops itself before the job time limit)
        if: github.event_name == 'schedule' || inputs.download
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          timeout --signal=INT 320m twbt update --min-age-hours 600 2>&1 | tee update.log \
            || echo "stopped, will resume"

      - name: Save raw data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - run: twbt build

      - name: Research study
        if: inputs.research
        run: twbt research --out data/research

      - name: Report (run summary page + `reports` branch)
        if: always()
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
        run: |
          {
            echo "# twbt report — run ${{ github.run_id }}, $(date -u +%Y-%m-%dT%H:%MZ)"
            echo; echo '## status'; echo '```'; twbt status 2>&1 || echo "(exit $?)"; echo '```'
            echo; echo '## download log (last 40 lines)'; echo '```'
            tail -n 40 update.log 2>/dev/null || echo "(no download this run)"; echo '```'
            echo; echo '## factor analysis (signal variants, no costs)'; echo '```'
            twbt factor 2>&1 || echo "(exit $?)"; echo '```'
            echo; echo '## backtest: current strategy (sum, no construction, 3 months up)'; echo '```'
            twbt backtest 2>&1 || echo "(exit $?)"; echo '```'
            echo; echo '## backtest: original version, for comparison'; echo '```'
            twbt backtest --no-save --method mean --min-consecutive 0 --keep-construction 2>&1 \
              || echo "(exit $?)"; echo '```'
            echo; echo '## baseline: all liquid stocks, equal weight, no commission or slippage'; echo '```'
            twbt backtest --no-save --strategy equal --discount 0 --min-fee 0 --slippage 0 2>&1 \
              || echo "(exit $?)"; echo '```'
            IFS=';' read -ra runs <<< "$EXPERIMENTS"
            for cmd in "${runs[@]}"; do
              read -ra argv <<< "$cmd"
              [ ${#argv[@]} -eq 0 ] && continue
              echo; echo "## experiment: twbt ${argv[*]}"; echo '```'
              twbt "${argv[@]}" 2>&1 || echo "(exit $?)"; echo '```'
            done
            echo; echo '## signal'; echo '```'; twbt signal 2>&1 || echo "(exit $?)"; echo '```'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          dir=$(mktemp -d); cp report.md "$dir/"
          # keep the last published study unless this run produced a new one
          if [ -d data/research ]; then cp -r data/research "$dir/research"; else
            git fetch -q --depth 1 origin reports 2>/dev/null \
              && git archive FETCH_HEAD research 2>/dev/null | tar -x -C "$dir" || true
          fi
          cd "$dir"
          git init -q -b reports && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com \
            commit -q -m "report ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" reports

      - uses: actions/upload-artifact@v4
        with:
          name: clean-data
          path: data/clean
          retention-days: 30
