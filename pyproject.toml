[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twbt"
version = "0.1.0"
description = "Taiwan stock backtesting framework — data layer"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
research = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
twbt = "twbt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows and report prose read better unwrapped.
"src/twbt/research/report.py" = ["E501"]
